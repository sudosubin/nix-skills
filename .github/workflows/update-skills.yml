name: Update Skills

on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.shards.outputs.shards }}

    steps:
      - id: shards
        run: echo "shards=[$(seq -s', ' 1 256)]" >> $GITHUB_OUTPUT

  update:
    name: Update
    runs-on: ubuntu-latest
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}

    steps:
      - uses: actions/checkout@v6

      - uses: nixbuild/nix-quick-install-action@v34

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm update-skills update ${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=5120 --expose-gc

      - uses: actions/upload-artifact@v6
        with:
          name: data-${{ matrix.shard }}
          path: data/shard/*.json
          retention-days: 1

  commit:
    name: Commit
    runs-on: ubuntu-latest
    needs: [update]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: data/shard
          pattern: data-*
          merge-multiple: true

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm update-skills combine

      - uses: ./.github/actions/commit-push
        with:
          message: "feat: update skills"
          paths: data/by-name
