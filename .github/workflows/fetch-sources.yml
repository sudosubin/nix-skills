name: Fetch Sources

on:
  schedule:
    - cron: "45 */3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

jobs:
  fetch:
    name: Fetch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        source: [skills.sh, skillsdirectory.com]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm fetch-sources fetch ${{ matrix.source }}

      - uses: ./.github/actions/commit-push
        with:
          message: "chore: update ${{ matrix.source }} sources"
          paths: data/source-*.json
