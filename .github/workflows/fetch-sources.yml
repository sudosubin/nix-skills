name: Fetch Sources

on:
  schedule:
    - cron: "45 */3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

jobs:
  fetch:
    name: Fetch
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm fetch-sources fetch skills.sh
      - run: pnpm fetch-sources fetch skillsdirectory.com

      - id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-*.json
          if git diff --cached --quiet; then
            echo "skip=1" >> $GITHUB_OUTPUT
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "chore: update source lists"

      - if: steps.commit.outputs.skip != '1'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 10
          command: "git push origin HEAD:main"
          on_retry_command: "git pull --rebase --autostash origin main"
